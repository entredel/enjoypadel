<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">enjoypadel | Padel & Tenis File İçi Telefon Kayıt Aparatı</title>
    <meta id="meta-desc" name="description" content="Padel ve tenis maçlarınızı kolayca kaydedin! Can Ertuğrul & Can Özdoğan ortaklığında geliştirilen enjoypadel 3D baskı PETG dayanıklı, fileye takılan telefon tutucu." />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brandPrimary: '#6366f1', brandSecondary: '#06b6d4', darkBg: '#090d16' } } }
        }
    </script>
    <style>
        .premium-gradient { background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, rgba(6, 182, 212, 0.05) 40%, rgba(9, 13, 22, 0) 70%); }
    </style>
</head>
<body class="bg-darkBg text-white antialiased premium-gradient min-h-screen">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 border-b border-neutral-900 bg-darkBg/80 backdrop-blur-md">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex flex-col">
                <a href="#" class="text-xl font-black tracking-wider text-white"><span class="text-brandSecondary">[</span>enjoypadel<span class="text-brandPrimary">]</span></a>
                <span class="text-[9px] text-neutral-500 font-mono tracking-wider uppercase">by Ertuğrul & Özdoğan</span>
            </div>

            <div class="flex items-center space-x-6">
                <nav class="hidden md:flex space-x-8 text-sm font-medium text-neutral-400">
                    <a href="#urun" data-i18n="nav_product" class="hover:text-brandSecondary">Ürün</a>
                    <a href="#ozellikler" data-i18n="nav_features" class="hover:text-brandSecondary">Özellikler</a>
                    <a href="#fiyat" data-i18n="nav_price" class="hover:text-brandSecondary">Fiyat</a>
                </nav>
                
                <!-- Dil Seçici -->
                <div class="flex items-center space-x-1 bg-neutral-900 p-1 rounded-lg border border-neutral-800">
                    <button onclick="setLanguage('tr')" class="lang-btn px-2 py-1 text-[10px] font-bold rounded hover:bg-neutral-800" data-lang="tr">TR</button>
                    <button onclick="setLanguage('en')" class="lang-btn px-2 py-1 text-[10px] font-bold rounded hover:bg-neutral-800" data-lang="en">EN</button>
                    <button onclick="setLanguage('de')" class="lang-btn px-2 py-1 text-[10px] font-bold rounded hover:bg-neutral-800" data-lang="de">DE</button>
                </div>
            </div>
        </div>
    </header>

    <!-- HERO (Örnek Yapı - Tüm içeriği i18n ile güncelle) -->
    <section class="px-4 pt-20 text-center">
        <h1 class="text-5xl font-extrabold text-white" data-i18n="hero_title">Padel maçlarını kusursuz açıyla kaydet.</h1>
        <p class="mt-4 text-neutral-400" data-i18n="hero_subtitle">Yeni nesil kompakt telefon tutucu.</p>
    </section>

    <!-- DİL MOTORU -->
    <script>
        const translations = {
            tr: {
                page_title: "enjoypadel | Padel & Tenis File İçi Telefon Kayıt Aparatı",
                meta_desc: "Padel ve tenis maçlarınızı kolayca kaydedin! Can Ertuğrul & Can Özdoğan ortaklığında geliştirilen enjoypadel.",
                nav_product: "Ürün", nav_features: "Özellikler", nav_price: "Fiyat",
                hero_title: "Padel maçlarını kusursuz açıyla kaydet.",
                hero_subtitle: "Yeni nesil kompakt telefon tutucu."
            },
            en: {
                page_title: "enjoypadel | Premium Padel & Tennis Camera Mount",
                meta_desc: "Capture your padel and tennis matches with ease! The new generation mount by Can Ertuğrul & Can Özdoğan.",
                nav_product: "Product", nav_features: "Features", nav_price: "Pricing",
                hero_title: "Capture every rally with the perfect angle.",
                hero_subtitle: "Next-gen compact smartphone mount."
            },
            de: {
                page_title: "enjoypadel | Padel & Tennis Smartphone-Halterung",
                meta_desc: "Nimm deine Padel- und Tennisspiele einfach auf! Die neue Generation von Can Ertuğrul & Can Özdoğan.",
                nav_product: "Produkt", nav_features: "Funktionen", nav_price: "Preise",
                hero_title: "Nimm dein Spiel aus dem perfekten Winkel auf.",
                hero_subtitle: "Die neue, kompakte Smartphone-Halterung."
            }
        };

        function setLanguage(lang) {
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            
            // SEO Güncelleme
            document.getElementById('page-title').innerText = translations[lang].page_title;
            document.getElementById('meta-desc').content = translations[lang].meta_desc;

            // Metinleri Güncelle
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });

            // Buton Stili
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('bg-brandPrimary', btn.getAttribute('data-lang') === lang);
                btn.classList.toggle('text-white', btn.getAttribute('data-lang') === lang);
            });
        }

        // Başlangıç
        const savedLang = localStorage.getItem('lang') || 'tr';
        setLanguage(savedLang);
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
